name: Grant runtime access to analytics password

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  grant-runtime-access:
    name: Grant Secret Manager Secret Accessor on portfolio-analytics-password
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Grant runtime SA the secretAccessor role on the secret
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          gcloud secrets add-iam-policy-binding portfolio-analytics-password \
            --project="${GCP_PROJECT_ID}" \
            --member="serviceAccount:${GCP_RUNTIME_SERVICE_ACCOUNT}" \
            --role="roles/secretmanager.secretAccessor" \
            --condition=None \
            --quiet
          echo "== Effective binding =="
          gcloud secrets get-iam-policy portfolio-analytics-password \
            --project="${GCP_PROJECT_ID}" \
            --format='table(bindings.role, bindings.members)'
