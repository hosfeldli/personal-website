name: Rotate analytics password

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  rotate-password:
    name: Publish a new Secret Manager version
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Add a new secret version for portfolio-analytics-password
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          ANALYTICS_PASSWORD: ${{ secrets.ANALYTICS_PASSWORD }}
        run: |
          set -euo pipefail
          echo "::add-mask::${ANALYTICS_PASSWORD}"
          if [[ -z "${ANALYTICS_PASSWORD}" ]]; then
            echo "::error::Repository secret ANALYTICS_PASSWORD is not set"
            exit 1
          fi
          printf '%s' "${ANALYTICS_PASSWORD}" | gcloud secrets versions add portfolio-analytics-password \
            --project="${GCP_PROJECT_ID}" \
            --data-file=- \
            --quiet
