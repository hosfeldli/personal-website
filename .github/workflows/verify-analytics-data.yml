name: Verify analytics data

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Query analytics table
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          DATASET: ${{ vars.GCP_ANALYTICS_DATASET }}
          TABLE: ${{ vars.GCP_ANALYTICS_TABLE }}
        run: |
          set -euo pipefail
          bq query --use_legacy_sql=false --format=prettyjson \
            "SELECT COUNT(*) AS row_count, COUNTIF(type = 'page_view') AS page_views, MAX(timestamp) AS latest_event FROM \\`${PROJECT_ID}.${DATASET}.${TABLE}\\`"
          bq query --use_legacy_sql=false --format=prettyjson \
            "SELECT type, COUNT(*) AS count FROM \\`${PROJECT_ID}.${DATASET}.${TABLE}\\` GROUP BY type ORDER BY count DESC"
