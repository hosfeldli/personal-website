name: Build and deploy Stem portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    name: Cloud Build → Cloud Run host
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate deployment configuration
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
          GCP_CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
          GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          GCP_DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_ANALYTICS_DATASET: ${{ vars.GCP_ANALYTICS_DATASET }}
          GCP_ANALYTICS_TABLE: ${{ vars.GCP_ANALYTICS_TABLE }}
        run: |
          set -euo pipefail

          required=(
            GCP_PROJECT_ID
            GCP_REGION
            GCP_ARTIFACT_REPOSITORY
            GCP_CLOUD_RUN_SERVICE
            GCP_RUNTIME_SERVICE_ACCOUNT
            GCP_DEPLOYER_SERVICE_ACCOUNT
            GCP_WORKLOAD_IDENTITY_PROVIDER
            GCP_ANALYTICS_DATASET
            GCP_ANALYTICS_TABLE
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub repository variable: ${name}"
              exit 1
            fi
          done

          if [[ "$GCP_WORKLOAD_IDENTITY_PROVIDER" != projects/*/locations/global/workloadIdentityPools/*/providers/* ]]; then
            echo "::error::GCP_WORKLOAD_IDENTITY_PROVIDER must be a full provider resource name"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Submit Cloud Build
        run: |
          gcloud builds submit \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --config=cloudbuild.yaml \
            --substitutions=_REGION="${{ vars.GCP_REGION }}",_REPOSITORY="${{ vars.GCP_ARTIFACT_REPOSITORY }}",_SERVICE="${{ vars.GCP_CLOUD_RUN_SERVICE }}",_RUNTIME_SERVICE_ACCOUNT="${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}",_ANALYTICS_DATASET="${{ vars.GCP_ANALYTICS_DATASET }}",_ANALYTICS_TABLE="${{ vars.GCP_ANALYTICS_TABLE }}"
