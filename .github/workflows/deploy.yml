name: Build and deploy Stem portfolio

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    name: Cloud Build → Cloud Run host
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate deployment configuration
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
          GCP_CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
          GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          GCP_DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          set -euo pipefail

          required=(
            GCP_PROJECT_ID
            GCP_REGION
            GCP_ARTIFACT_REPOSITORY
            GCP_CLOUD_RUN_SERVICE
            GCP_RUNTIME_SERVICE_ACCOUNT
            GCP_DEPLOYER_SERVICE_ACCOUNT
            GCP_WORKLOAD_IDENTITY_PROVIDER
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub repository variable: ${name}"
              exit 1
            fi
          done

          if [[ "$GCP_WORKLOAD_IDENTITY_PROVIDER" != projects/*/locations/global/workloadIdentityPools/*/providers/* ]]; then
            echo "::error::GCP_WORKLOAD_IDENTITY_PROVIDER must be a full provider resource name"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Submit and verify Cloud Build
        run: |
          # The GitHub OIDC principal can submit and inspect a build, but cannot
          # stream the default Cloud Build log bucket. Submit asynchronously, then
          # poll the build resource so this workflow reflects the real deployment.
          build_id="$(gcloud builds submit \
            --async \
            --region=global \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --config=cloudbuild.yaml \
            --substitutions=_REGION="${{ vars.GCP_REGION }}",_REPOSITORY="${{ vars.GCP_ARTIFACT_REPOSITORY }}",_SERVICE="${{ vars.GCP_CLOUD_RUN_SERVICE }}",_RUNTIME_SERVICE_ACCOUNT="${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}",_IMAGE_TAG="${{ github.sha }}" \
            --format='value(id)')"

          if [[ -z "$build_id" ]]; then
            echo "::error::Cloud Build did not return a build ID"
            exit 1
          fi

          echo "Waiting for Cloud Build $build_id"
          for attempt in {1..80}; do
            status="$(gcloud builds describe "$build_id" \
              --project="${{ vars.GCP_PROJECT_ID }}" \
              --region=global \
              --format='value(status)')"
            echo "Cloud Build status: $status"
            case "$status" in
              SUCCESS)
                exit 0
                ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "::error::Cloud Build $build_id ended with $status"
                exit 1
                ;;
            esac
            sleep 15
          done

          echo "::error::Timed out waiting for Cloud Build $build_id"
          exit 1
